name: AI Dev Pipeline
# 觸發此 action 的時機
on: [push, pull_request]

# 預先定義此 action 要幹嘛
jobs:
#設定環境測試
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: echo "TaoYuanGutter, GitHub Actions!"

