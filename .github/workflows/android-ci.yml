name: Android CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set a build-only Maps placeholder
        run: printf 'MAPS_API_KEY=ci-placeholder\n' > local.properties

      - name: Run task-scoped JVM tests
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.example.taoyuangutter.common.PhotoUploadSlotStateTest' \
            --tests 'com.example.taoyuangutter.gutter.PhotoUploadCandidateResolverTest' \
            --tests 'com.example.taoyuangutter.api.StoreDitchNodeRequestMapperTest'

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
