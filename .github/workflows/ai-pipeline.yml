# AI API 檢查
      - name: GPT Review (OpenAI 5.4 mini)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          DIFF=$(git diff HEAD~1 HEAD)
          RESPONSE=$(curl -s -X POST https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-5.4-mini",
              "messages": [
                {"role":"system","content":"你是程式碼審查助手"},
                {"role":"user","content":"請檢查以下 commit 是否符合規範: '"$DIFF"'"}
              ]
            }')
          echo "GPT Review Result: $RESPONSE"

          if echo "$RESPONSE" | grep -q "不符合規範"; then
            echo "❌ Commit 未通過 AI Review"
            exit 1
          else
            echo "✅ Commit 通過 AI Review"
          fi


